[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-bank"
version = "0.1.0"
description = "Git-backed long-term memory bank CLI for persistent AI development context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.20,<1.0",
  "PyYAML>=6,<7",
]

[project.scripts]
ai-sync = "ai_memory_bank.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
